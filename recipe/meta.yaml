{% set name = "drafthorse" %}
{% set version = "2025.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/drafthorse-{{ version }}.tar.gz
  sha256: 3a86d17cc7d2796dabb130f599dc119737a50ce8847e32226aecb9bea3af00d0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - pypdf
    - python >={{ python_min }}
    - lxml

test:
  imports:
    - drafthorse
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pretix/python-drafthorse
  summary: Python ZUGFeRD XML implementation
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - BastianZim
